<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
    <style>
        body {
            background-color: #2c2c2c;
            color: #fc036c;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        h1, h2 {
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* Formulário */
        form {
            background-color: #3a3a3a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        form input {
            width: 100%;
            margin-bottom: 10px;
            padding: 6px 8px;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        /* Botão Cadastrar/Salvar */
        form button.submit-btn {
            padding: 5px 10px;
            font-size: 0.85rem;
            border-radius: 3px;
            background-color: #fc036c;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        form button.submit-btn:hover {
            transform: scale(1.05);
        }

        /* Tabela */
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        th, td {
            padding: 10px 12px;
            font-size: 0.9rem;
            text-align: left;
        }

        th {
            background-color: #555;
            font-weight: 600;
        }

        tr:nth-child(even) { background-color: #444; }
        tr:nth-child(odd) { background-color: #3a3a3a; }
        tr:hover { background-color: #555; }

        a {
            color: #ff6b81;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        a:hover { color: #fc036c; text-decoration: underline; }

        /* Botão Export CSV fixo e minimalista */
        .export-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 2px;
            background-color: #fc036c;
            color: #fff;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        .export-btn:hover {
            transform: scale(1.05);
        }

    </style>
</head>
<body>

<h1>Cadastro de Produtos</h1>

<!-- Formulário -->
<form method="POST">
    {% if produto_edit %}
        <input type="hidden" name="id" value="{{ produto_edit.id }}">
        <input type="text" name="nome" value="{{ produto_edit.nome }}" required autocomplete="off">
        <input type="number" step="0.01" name="preco" value="{{ produto_edit.preco }}" required autocomplete="off">
        <input type="number" name="quantidade" value="{{ produto_edit.quantidade }}" required autocomplete="off">
        <button type="submit" class="submit-btn">Salvar</button>
        <p><a href="{{ url_for('index') }}">Cancelar edição</a></p>
    {% else %}
        <input type="text" name="nome" placeholder="Nome do produto" required autocomplete="off">
        <input type="number" step="0.01" name="preco" placeholder="Preço" required autocomplete="off">
        <input type="number" name="quantidade" placeholder="Quantidade" required autocomplete="off">
        <button type="submit" class="submit-btn">Cadastrar</button>
    {% endif %}
</form>
<form method="GET" action="/export" style="
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 1000;
    width: auto;       
    height: auto;      
    margin: 0;    
    padding: 0;        
">
    <button type="submit" style="
        padding: 2px 6px; 
        font-size: 0.75rem;
        border-radius: 2px;
        background-color: #fc036c;
        color: #fff;
        border: none;
        cursor: pointer;
        white-space: nowrap;
    ">Exportar para CSV</button>
</form>



<h2>Lista de Produtos</h2>
<table>
    <tr>
        <th>ID</th><th>Nome</th><th>Preço</th><th>Quantidade</th><th>Ações</th>
    </tr>
    {% for p in produtos %}
    <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.nome }}</td>
        <td>R$ {{ "%.2f"|format(p.preco) }}</td>
        <td>{{ p.quantidade }}</td>
        <td>
            <a href="/?edit_id={{ p.id }}">Editar</a> |
            <a href="/delete/{{ p.id }}">Lixeira</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
